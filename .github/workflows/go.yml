# CI of the Go agent on branch alpha (nightly, docs/go-rewrite/README.md). The TypeScript checks
# in release.yml keep running until the cutover commit (alpha merged into main) switches CI over
# to Go (docs/go-rewrite/cutover.md §B).
name: go

on:
  push:
    branches: [alpha]
  pull_request:
    branches: [alpha]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # git describe needs tags and history for the version string.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: generated code matches proto/agent.proto
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          unzip -q "$tmp/protoc.zip" -d "$tmp/protoc"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          PROTOC="$tmp/protoc/bin/protoc" bash scripts/gen-proto.sh
          git diff --exit-code -- internal/agentpb
      - name: delivery scripts (shellcheck + dry runs against a local fake release)
        run: bash scripts/test-delivery.sh
      - name: build linux/amd64 and linux/arm64
        run: |
          set -euo pipefail
          # --match 'v*': the nightly tag (job nightly below) must never become the
          # version — the orchestrator only understands vX.Y.Z[-N-gHASH] (spec A §7.3).
          version="$(git describe --tags --match 'v*')"
          bash scripts/build-release.sh "$version" dist-go
      - uses: actions/upload-artifact@v4
        with:
          name: route-agent-binaries
          path: dist-go/

  # Nightly channel (docs/go-rewrite/update.md, cutover.md §A): every push to alpha that passed
  # the checks replaces the assets of the prerelease `nightly` (the tag itself stays put, see
  # below). Nodes on the nightly channel take it: SelfUpdate with x-agent-channel: nightly,
  # bridge-to-go.sh --channel nightly, install-go.sh --channel nightly. A prerelease never becomes
  # releases/latest, so stable nodes (releases/latest/download) are unaffected.
  nightly:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/alpha'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two pushes in a row must not interleave their uploads; the later one simply runs second.
    concurrency:
      group: nightly
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: route-agent-binaries
          path: dist-go
      - name: replace the nightly prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag=nightly
          # The tag is created once and never moved; only the assets are replaced. A moved tag
          # breaks every TypeScript node that fetched it before: their SelfUpdate starts with
          # `git fetch --all --tags` (no --force), which rejects the new position ("would clobber
          # existing tag") with exit 1 and stops the whole update chain, on every later update.
          # The build's commit is in the release notes.
          if ! gh api "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            gh api -X POST "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${tag}" -f sha="$SHA" >/dev/null
          fi
          notes="Nightly build of the Go agent from branch alpha, commit ${SHA}."
          notes+=" Not a release: stable nodes never take it (releases/latest skips prereleases)."
          notes+=" Nodes on the nightly channel update from it (docs/go-rewrite/update.md)."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --prerelease --latest=false --title "Go agent nightly" --notes "$notes"
          else
            gh release create "$tag" --verify-tag --prerelease --latest=false --title "Go agent nightly" --notes "$notes"
          fi
          # Binaries first, checksums last: a node installing in between gets a checksum mismatch
          # (refused, nothing installed), never a binary paired with a stale but "valid" sum.
          gh release upload "$tag" dist-go/route-agent-linux-amd64 dist-go/route-agent-linux-arm64 --clobber
          gh release upload "$tag" dist-go/checksums.txt --clobber
          gh release view "$tag" --json tagName,isPrerelease,assets --jq '{tagName, isPrerelease, assets: [.assets[].name]}'
