syntax = "proto3";

package agent;

service EgressAgentService {
  // Загрузка и безопасная перезагрузка конфигурации sing-box
  rpc ApplyConfig (ConfigPayload) returns (ConfigResponse);

  // Серверный стрим RPC для передачи телеметрии ноды в реальном времени
  rpc StreamTelemetry (TelemetryRequest) returns (stream TelemetryResponse);

  // Приём бинарного файла sing-box напрямую от оркестратора
  rpc UploadSingboxBinary (stream BinaryChunk) returns (UpgradeResponse);

  // Приём бинарных файлов olcrtc / olcrtc-manager напрямую от оркестратора
  rpc UploadOlcrtcBinary (stream BinaryChunk) returns (UpgradeResponse);

  // Дистанционная настройка Caddy (Caddyfile + HTML-заглушка)
  rpc ConfigureCaddy (CaddyConfigPayload) returns (CaddyConfigResponse);

  // Дистанционная установка и управление службой olcrtc-manager (WebRTC)
  rpc ConfigureOlcrtc (OlcrtcConfigPayload) returns (OlcrtcConfigResponse);

  // Дистанционная настройка L3-интерфейса AmneziaWG 3.0 (AWG3)
  rpc ConfigureAwg (AwgConfigPayload) returns (AwgConfigResponse);

  // Дистанционное управление правилами UFW фаервола
  rpc ManageFirewall (FirewallPayload) returns (FirewallResponse);

  // Дистанционное самообновление кода агента из Git
  rpc SelfUpdate (SelfUpdatePayload) returns (SelfUpdateResponse);
}

message ConfigPayload {
  string config_json = 1;
}

message ConfigResponse {
  bool success = 1;
  string message = 2;
}

message TelemetryRequest {
  string orchestrator_secret = 1;
}

message TelemetryResponse {
  double cpu_usage = 1;
  double mem_usage = 2;
  uint32 active_connections = 3;
  string system_logs = 4;
  int64 timestamp = 5;
  string webrtc_status = 6;
  string singbox_version = 7;
  uint32 awg_active_peers = 8;
}

message BinaryChunk {
  string orchestrator_secret = 1;
  bytes chunk = 2;
  string version = 3;
  bool is_final = 4;
  string target_binary = 5; // "sing-box" | "olcrtc" | "olcrtc-manager"
}

message UpgradeResponse {
  bool success = 1;
  string message = 2;
}

message CaddyConfigPayload {
  repeated string domains = 1;
  string domain = 2;
  uint32 decoy_port = 3;
  string html_content = 4;
}

message CaddyConfigResponse {
  bool success = 1;
  string message = 2;
}

message OlcrtcConfigPayload {
  bool enabled = 1;
  string user = 2;
  string password = 3;
  uint32 port = 4;
}

message OlcrtcConfigResponse {
  bool success = 1;
  string message = 2;
}

message AwgPeer {
  string public_key = 1;
  string preshared_key = 2;
  string allowed_ips = 3;
}

message AwgConfigPayload {
  bool enabled = 1;
  uint32 port = 2;
  string server_private_key = 3;
  string server_public_key = 4;
  string address_v4 = 5;
  string address_v6 = 6;

  // AWG3 параметры обфускации
  uint32 jc = 7;
  uint32 jmin = 8;
  uint32 jmax = 9;
  uint32 s1 = 10;
  uint32 s2 = 11;
  uint32 s3 = 12;
  uint32 s4 = 13;
  uint32 h1 = 14;
  uint32 h2 = 15;
  uint32 h3 = 16;
  uint32 h4 = 17;
  string header_protection_key = 18;

  repeated AwgPeer peers = 19;
  string ipv6_mode = 20; // "dual-stack" | "ipv4-only" | "trap-ipv6"
}

message AwgConfigResponse {
  bool success = 1;
  string message = 2;
}

message FirewallPayload {
  repeated uint32 open_udp_ports = 1;
  repeated uint32 open_tcp_ports = 2;
}

message FirewallResponse {
  bool success = 1;
  string message = 2;
}

message SelfUpdatePayload {}

message SelfUpdateResponse {
  bool success = 1;
  string message = 2;
}
