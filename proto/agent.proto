syntax = "proto3";

package agent;

service EgressAgentService {
  // Unary RPC to upload and safely reload sing-box configuration
  rpc ApplyConfig (ConfigPayload) returns (ConfigResponse);

  // Server Streaming RPC to continuously receive real-time node telemetry
  rpc StreamTelemetry (TelemetryRequest) returns (stream TelemetryResponse);

  // Unary RPC to get immediate single snapshot telemetry
  rpc GetTelemetry (TelemetryRequest) returns (TelemetryResponse);

  // Unary RPC to trigger sing-box binary upgrade on the node
  rpc UpgradeSingbox (UpgradePayload) returns (UpgradeResponse);

  // Unary RPC to create/update one olcrtc instance's YAML config + systemd unit on the node —
  // idempotent (same shape write + restart every time, matching ConfigureAwg/ConfigureMeshTunnel).
  // Replaces the old ConfigureOlcrtc (proxied a third-party Olcrtc_manager admin daemon) — see plan
  // `olcrtc-redesign.md`, "Новая архитектура: собственный слой": route-agent now runs
  // olcrtc-agent-srv directly, one systemd unit per (user, node) instance, no admin HTTP surface.
  rpc SyncOlcrtcInstance (OlcrtcInstanceConfigPayload) returns (OlcrtcInstanceConfigResponse);

  // Unary RPC to stop+disable+remove one olcrtc instance's systemd unit + config.
  rpc DeleteOlcrtcInstance (OlcrtcInstanceDeletePayload) returns (OlcrtcInstanceConfigResponse);

  // Server Streaming RPC — one open stream per olcrtc-capable node, forwards every
  // session_open/session_close/traffic/health event across ALL instances running on that node in
  // real time, each event tagged with which instance/user it belongs to. Doesn't fit
  // TelemetryResponse's flat per-node-scalar shape (event-driven/high-frequency, not a periodic
  // snapshot) — mirrors StreamTelemetry's per-node-stream shape instead. Source: olcrtc-agent-srv's
  // own stdout JSON lines (see that repo's events.go), tailed off each instance's systemd journal.
  rpc StreamOlcrtcEvents (OlcrtcEventsRequest) returns (stream OlcrtcEvent);

  // Unary RPC to trigger agent self-update from repository
  rpc SelfUpdate (SelfUpdatePayload) returns (SelfUpdateResponse);

  // Client Streaming RPC to stream binary payload to the node agent
  rpc UploadSingboxBinary (stream BinaryChunkPayload) returns (UploadBinaryResponse);

  // Client Streaming RPC to stream AWG Tools (awg) binary to the node agent
  rpc UploadAwgToolsBinary (stream BinaryChunkPayload) returns (UploadBinaryResponse);

  // Client Streaming RPC to stream AWG Go Core (amneziawg-go) binary to the node agent
  rpc UploadAwgGoBinary (stream BinaryChunkPayload) returns (UploadBinaryResponse);

  // Client Streaming RPC to stream a custom-built Caddy binary (caddy-dns/cloudflare plugin) to the node agent — Xeon-ring nodes only
  rpc UploadCaddyBinary (stream BinaryChunkPayload) returns (UploadBinaryResponse);

  // Unary RPC for AmneziaWG3 service management
  rpc ConfigureAwg (AwgConfigPayload) returns (AwgConfigResponse);

  // Unary RPC to configure Caddy (TLS certificates manager)
  rpc ConfigureCaddy (CaddyConfigPayload) returns (CaddyConfigResponse);

  // Client Streaming RPC to stream the olcrtc-agent-srv binary to the node agent — replaces the old
  // UploadOlcrtcBinary (uploaded the third-party Olcrtc_manager binary, no longer used).
  rpc UploadOlcrtcAgentSrvBinary (stream BinaryChunkPayload) returns (UploadBinaryResponse);

  // Client Streaming RPC to stream the AmneziaWG kernel-module SOURCE tarball (S2S mesh tunnel,
  // front↔egress, second ring-relay hop) to the node agent — fetched centrally by the
  // orchestrator (never git-cloned by the node itself, see githubService.ts's
  // ensureAwgKernelModuleSource — a RF-hosted node reaching github.com directly would recreate
  // the exact SNI/IP DPI-visibility risk this whole tunnel exists to avoid). On the final chunk
  // the agent extracts the tarball and builds it locally via DKMS against its own running
  // kernel — a kernel module can't be cross-compiled centrally like the other Upload*Binary RPCs.
  rpc UploadMeshAwgKernelSource (stream BinaryChunkPayload) returns (UploadBinaryResponse);

  // Unary RPC to configure/reload the S2S AmneziaWG3 mesh-tunnel interface (front↔egress, second
  // ring-relay hop) — distinct from ConfigureAwg (client-facing AWG service, different interface,
  // different key material). Reuses the already-delivered awg/awg-quick tools (UploadAwgToolsBinary)
  // — once the kernel module is loaded, awg-quick drives it directly via netlink, no separate
  // userspace core needed for this interface.
  rpc ConfigureMeshTunnel (MeshTunnelConfigPayload) returns (MeshTunnelConfigResponse);

  // Unary RPC for dynamic firewall management on node
  rpc ManageFirewall (FirewallPayload) returns (FirewallResponse);

  // Unary RPC to query agent version & protocol contract hash
  rpc GetAgentInfo (AgentInfoRequest) returns (AgentInfoResponse);
  rpc RunNetworkDiagnostic (NetworkDiagnosticRequest) returns (NetworkDiagnosticResponse);

  // Unary RPC to read a Caddy-managed certificate's PEM content off disk (Xeon-ring wildcard
  // cert courier: orchestrator polls this after DNS-01 issuance, then relays the result to
  // every egress node behind that front via ConfigureCaddy's extra_cert_pem/extra_key_pem)
  rpc GetManagedCertificate (CertificateRequest) returns (CertificateResponse);

  // Unary RPC to fetch per-user traffic deltas from sing-box's OWN local V2Ray-API-compatible
  // stats service (experimental.v2ray_api, loopback-only — see egressSingbox.ts's generator and
  // the tuic/hysteria2 inbound `users[].name` field, set to our own user uuid so sing-box's
  // `user>>>{name}>>>traffic>>>uplink/downlink` counters map back to it directly). Route-agent
  // reads the currently-applied sing-box config off disk to find the live listen address, dials
  // it locally, and returns already-parsed per-user deltas — the orchestrator never talks to
  // sing-box directly, and no new port is exposed publicly anywhere. Watcher v2 "Track B-lite"
  // (2026-08-19) — a decoy-only, corroboration-gated traffic-anomaly signal for tuic/hy2Sb,
  // mirroring Track A's Remnawave-bandwidth-stats signal for VLESS/hy2Rw. See watcher's own
  // CLAUDE.md for the confidence/tier cap this must never exceed.
  rpc GetSingBoxUserTraffic (SingBoxUserTrafficRequest) returns (SingBoxUserTrafficResponse);

  // Unary RPC to fetch per-connection records from sing-box's OWN local Clash API
  // (experimental.clash_api, loopback-only — see shared/utils/clashApi.ts for why this replaced
  // the previous v2ray_api channel: `with_v2ray_api` is absent from official sing-box release
  // builds, so a config carrying that block failed `sing-box check` outright).
  //
  // Route-agent reads the currently-applied sing-box config off disk to find the live
  // external_controller address and secret, dials it locally and returns already-parsed records —
  // the orchestrator never talks to sing-box directly and no new port is exposed publicly.
  //
  // ONE RPC serves BOTH node kinds, because the same agent runs on both. Which fields come back
  // populated differs, and that difference is the point:
  //   - egress node: `user` is set (tuic/hy2 inbounds put the authenticated user into
  //     metadata.User) and `destination_*` is the real target;
  //   - Xeon front: `user` is EMPTY — a blind SNI relay authenticates nobody — but `source_ip` is
  //     the real client address, which the egress side can never see after the relay (see the
  //     "real-IP-through-relay" entry in BACKLOG.md).
  // The two halves are therefore analysed separately and never need to be joined.
  rpc GetSingBoxConnections (SingBoxConnectionsRequest) returns (SingBoxConnectionsResponse);

  // Unary RPC that brings the node's source-prefix rate limiting to the requested state and
  // returns the drop counters observed BEFORE that change.
  //
  // Enforced with a tc INGRESS policer, not an egress shaper: a mark on an incoming packet does
  // not carry over to the outgoing socket (sing-box terminates the connection and opens a new one
  // to the destination — which is exactly why it has its own routing_mark). So a source-based
  // limit applies to the "client -> us" leg, and that is enough: what a subscriber cannot push
  // into us, it cannot push onward either.
  //
  // The drops are half the point, not a side effect. Measured on a live kernel under one and the
  // same policer: cooperative TCP produced 122 drops in six seconds, a non-cooperative UDP flood
  // produced 1,791,515 (99.76% of what it sent, while still sending at full speed). Four orders of
  // magnitude apart — "keeps hammering despite loss" separates a flood from a large download by
  // BEHAVIOUR rather than volume, and that can only be learned by applying back-pressure.
  //
  // Counters are read before re-applying because rebuilding the filters resets them. The agent
  // therefore skips the rebuild entirely when the list, rate and burst are unchanged — otherwise
  // every delivery would erase the very evidence the escalation decision rests on.
  rpc ApplyTrafficThrottle (TrafficThrottleRequest) returns (TrafficThrottleResponse);
  // Unary RPC that brings the node's REAR sing-box instance to the requested state.
  //
  // A SECOND sing-box process on the same node, alongside the front one that terminates
  // subscribers. The front decides who may connect; the rear decides where their traffic goes —
  // "stars" wrapped into Cloudflare WARP, "games" straight out — and doubles as the point where
  // outbound direction is observed (its own Clash API, read the same way the front's already is,
  // see GetSingBoxConnections).
  //
  // ONE BINARY, TWO UNITS. The rear reuses the sing-box binary already installed for the front,
  // so UpgradeSingbox and SelfUpdate keep covering both and no second update path exists to drift.
  // The consequence is a hard precondition: with no sing-box installed there is nothing to run,
  // and the agent answers with skipped_reason instead of an error (the orchestrator does not even
  // offer the button in that case).
  //
  // The agent MUST run `sing-box check` on config_json before applying it. Writing an invalid
  // config and restarting would take down a working rear instance, and the branch that was
  // flowing through WARP would stop rather than degrade.
  rpc ConfigureRearSingbox (RearSingboxConfigPayload) returns (RearSingboxConfigResponse);
  // Unary RPC that reports the health of this node's WARP keys, read from the REAR sing-box's own
  // local Clash API (experimental.clash_api, loopback-only — same channel and same rationale as
  // GetSingBoxConnections, but pointed at the rear instance rather than the front one).
  //
  // THE MEASUREMENTS ARE NOT TAKEN HERE, AND THAT IS THE POINT. The rear config puts every WARP
  // endpoint into a urltest group, so sing-box already probes each of them on its own schedule and
  // keeps the result. Clash API's /proxies lists endpoints alongside outbounds and hands back that
  // stored history, so the agent only reads what has already been measured — no extra traffic on a
  // link the owner pays for by the byte. An empty history means the last probe FAILED: sing-box
  // deletes the entry on error and stores one on success.
  //
  // What this can and cannot see: it detects a key that is unreachable or slow. It does NOT
  // reliably detect a key Cloudflare has THROTTLED — throttling shows up as degraded throughput,
  // and measuring throughput was ruled out as too expensive. Treat a healthy report as "the tunnel
  // answers", not as "the key is at full speed".
  rpc GetWarpKeyHealth (WarpKeyHealthRequest) returns (WarpKeyHealthResponse);
}

message ConfigPayload {
  string config_json = 1;
}

message ConfigResponse {
  bool success = 1;
  string message = 2;
}

message TelemetryRequest {
  string orchestrator_secret = 1;
}

message TelemetryResponse {
  double cpu_usage = 1;
  double mem_usage = 2;
  uint32 active_connections = 3;
  string system_logs = 4;
  int64 timestamp = 5;
  string webrtc_status = 6;
  string singbox_version = 7;
  uint32 awg_active_peers = 8;
  string awg_version = 9;
  string awg_status = 10;
  string awg_tools_version = 11;
  string awg_go_version = 12;

  // S2S AWG3 mesh tunnel (front↔egress, second ring-relay hop) — read live off the node (dkms
  // status/modinfo/wg show), never a persisted DB flag, same self-healing rationale as
  // singbox_version/awg_tools_version above.
  string mesh_awg_kernel_status = 13;      // "not_installed" | "loaded" | "error"
  string mesh_awg_kernel_version = 14;
  string mesh_tunnel_interface_status = 15; // "up" | "down" | "absent"
  uint32 mesh_tunnel_active_peers = 16;
}

message UpgradePayload {
  string version = 1;      // e.g. "1.13.14"
  string download_url = 2; // Прямая ссылка на tar.gz
}

message UpgradeResponse {
  bool success = 1;
  string message = 2;
}

// One olcrtc instance = one running olcrtc-agent-srv systemd unit
// (olcrtc-agent-srv@<user_short_uuid>.service) = one YAML config file — see plan doc, "Конфиг и
// топология": the protocol itself doesn't multiplex multiple rooms in one process, so this is a
// per-user, not per-node, unit of configuration.
message OlcrtcInstanceConfigPayload {
  string orchestrator_secret = 1;
  string user_short_uuid = 2;   // identifies the systemd unit instance name
  string carrier = 3;           // "jitsi" | "telemost" | "wbstream" | "none"
  string transport = 4;         // "datachannel" | "vp8channel" | "seichannel" | "videochannel"
  string room_id = 5;           // full room URL for jitsi (confirmed live 2026-08-18), room slug for wbstream/telemost
  string crypto_key_hex = 6;    // 64 hex chars, generated centrally by the orchestrator
  string dns = 7;                // e.g. "8.8.8.8:53"

  // Optional transport-specific tuning — 0 means "field omitted, agent/upstream default applies".
  uint32 vp8_fps = 8;
  uint32 vp8_batch_size = 9;
  uint32 sei_fps = 10;
  uint32 sei_batch_size = 11;
  uint32 sei_fragment_size = 12;
  uint32 sei_ack_timeout_ms = 13;
}

message OlcrtcInstanceDeletePayload {
  string orchestrator_secret = 1;
  string user_short_uuid = 2;
}

message OlcrtcInstanceConfigResponse {
  bool success = 1;
  string message = 2;
}

message OlcrtcEventsRequest {
  string orchestrator_secret = 1;
}

// Mirrors olcrtc-agent-srv's own events.go Event shape (that repo's stdout JSON lines) — fields not
// relevant to a given type are simply left at their zero value, not modeled as a Go-style union, so
// the wire shape stays a flat struct like every other message in this file.
message OlcrtcEvent {
  string user_short_uuid = 1;  // which instance/systemd unit this event came from
  string type = 2;              // "session_open" | "session_close" | "traffic" | "health"
  int64 timestamp = 3;
  string session_id = 4;
  // Client-self-reported, NOT cryptographically verified (confirmed by reading olcrtc's own
  // internal/handshake — see plan doc, open question #1, closed 2026-08-18). Do not treat as an
  // authenticated identity signal — session_id is the trustworthy (server-generated) identifier.
  string device_id = 5;
  string reason = 6;
  string addr = 7;
  uint64 bytes_in = 8;
  uint64 bytes_out = 9;
  string health_json = 10;      // raw JSON passthrough of upstream's HealthStatus, not re-modeled here
}

message SelfUpdatePayload {}

message SelfUpdateResponse {
  bool success = 1;
  string message = 2;
}

message BinaryChunkPayload {
  string orchestrator_secret = 1;
  bytes chunk = 2;
  string version = 3;
  bool is_final = 4;
  string target_binary = 5;
}

message UploadBinaryResponse {
  bool success = 1;
  string message = 2;
}

message AwgPeer {
  string public_key = 1;
  string preshared_key = 2;
  string allowed_ips = 3; // "100.64.0.15/32, fd00:a001::15/128"
}

message AwgConfigPayload {
  bool enabled = 1;
  uint32 port = 2;                     // e.g. 51820
  string server_private_key = 3;
  string server_public_key = 4;
  string address_v4 = 5;               // "100.64.0.1/16"
  string address_v6 = 6;               // "fd00:a001::1/64"
  
  // AWG3 Obfuscation Parameters
  uint32 jc = 7;
  uint32 jmin = 8;
  uint32 jmax = 9;
  string s1 = 10;
  string s2 = 11;
  string s3 = 12;
  string s4 = 13;
  string h1 = 14;
  string h2 = 15;
  string h3 = 16;
  string h4 = 17;
  string header_protection_key = 18;

  repeated AwgPeer peers = 19;         // Список активных разрешенных пиров
  string ipv6_mode = 20;               // "dual-stack" | "ipv4-only" | "trap-ipv6"
  string i1 = 21;
  string i2 = 22;
  string i3 = 23;
  string i4 = 24;
  string i5 = 25;
}

message AwgConfigResponse {
  bool success = 1;
  string message = 2;
}

message MeshTunnelPeer {
  string public_key = 1;
  string allowed_ips = 2;          // "100.100.0.4/32, fd00:a002::4/128" — one /32(+/128) per peer, full mesh
  string endpoint = 3;             // "203.0.113.5:51821" — peer's real public IP:port (this hop is NOT itself tunneled)
  uint32 persistent_keepalive = 4;
}

message MeshTunnelConfigPayload {
  string orchestrator_secret = 1;
  // No interface-name field, deliberately: same precedent as AwgConfigPayload (client-facing AWG)
  // — the interface name is fixed node-side via config (MESH_AWG_CONFIG_PATH's basename, default
  // "awgmesh0"), not orchestrator-supplied. One mesh tunnel per node, no need for per-call naming.
  string private_key = 3;
  string address_v4 = 4;           // "100.100.0.4/16"
  string address_v6 = 5;           // "fd00:a002::4/64"
  uint32 listen_port = 6;

  // AWG3 obfuscation parameters — a single fixed set for the whole mesh (this is our own
  // server-to-server traffic, not client-facing, so it doesn't need per-peer variety the way
  // AwgConfigPayload's client mimicry does).
  uint32 jc = 7;
  uint32 jmin = 8;
  uint32 jmax = 9;

  repeated MeshTunnelPeer peers = 10; // full mesh: every other provisioned node on the opposite side (front<->egress)

  // H1-H4/S1-S4/I1-I5/HeaderProtectionKey — interface-level mimicry header/junk-size params.
  // Unlike Jc/Jmin/Jmax these MUST match byte-for-byte across every node in the mesh (a single
  // node's one awgmesh0 interface serves ALL peers on the opposite side at once, and these are
  // [Interface]-scoped, not per-peer) — see meshTunnelOrchestrator.ts's global mesh template.
  // Optional: empty string means "field omitted", matching AwgConfigPayload's own convention.
  string s1 = 11;
  string s2 = 12;
  string s3 = 13;
  string s4 = 14;
  string h1 = 15;
  string h2 = 16;
  string h3 = 17;
  string h4 = 18;
  string header_protection_key = 19;
  string i1 = 20;
  string i2 = 21;
  string i3 = 22;
  string i4 = 23;
  string i5 = 24;
}

message MeshTunnelConfigResponse {
  bool success = 1;
  string message = 2;
}

message CaddyConfigPayload {
  string caddyfile_content = 1;
  string camouflage_path = 2;
  string camouflage_html = 3;
  // Cloudflare API token (Zone:DNS:Edit) for DNS-01 wildcard cert issuance — Xeon-ring nodes
  // only, written by the agent to an EnvironmentFile referenced by the Caddy systemd override,
  // never inlined into caddyfile_content itself.
  string cloudflare_api_token = 4;
  // Wildcard cert/key PEM relayed from a Xeon front (via GetManagedCertificate) for static
  // (non-ACME) use on egress nodes' own Caddy — written directly into the same certBase path
  // tree EgressSingBoxGenerator already reads from for TUIC/Hysteria2.
  string extra_cert_pem = 5;
  string extra_key_pem = 6;
  string extra_cert_domain = 7;
  // ВСЕ кольцевые сертификаты разом, а не по одному за вызов.
  //
  // Появилось из живого отказа на чистой ноде (2026-09-03): Caddy проваливает КОНФИГ ЦЕЛИКОМ на
  // этапе provision, если хоть один указанный в нём файл сертификата отсутствует
  // ("provision tls: loading certificates: open ...: no such file or directory"). Прежнее
  // допущение в комментарии к syncCaddyOnNode — «Caddy просто не поднимет один неготовый сайт» —
  // оказалось неверным: не поднимается ничего, и нода не получает НИ ОДНОГО сертификата.
  //
  // Одиночных полей выше для этого мало: доставка по одному оставляет окно, в котором Caddyfile
  // уже ссылается на все кольцевые домены, а файлы лежат не все. Оркестратор держит сертификаты
  // всех фронтов у себя в базе, поэтому кладёт их сюда одним списком — агент пишет их ДО того,
  // как тронет Caddyfile, и промежуточного нерабочего состояния не возникает.
  //
  // Одиночные поля сохранены: их шлёт курьер, разносящий свежий сертификат одного фронта.
  repeated CaddyExtraCertificate extra_certificates = 8;
}

message CaddyExtraCertificate {
  // Домен в том виде, в каком он попадает в путь на диске (см. sanitizeDomainForStorage).
  string domain = 1;
  string cert_pem = 2;
  string key_pem = 3;
}

message CertificateRequest {
  string orchestrator_secret = 1;
  string domain = 2;
}

message CertificateResponse {
  bool success = 1;
  string message = 2;
  string fullchain_pem = 3;
  string private_key_pem = 4;
}

message CaddyConfigResponse {
  bool success = 1;
  string message = 2;
}

message FirewallPayload {
  repeated uint32 open_udp_ports = 1;
  repeated uint32 open_tcp_ports = 2;
}

message FirewallResponse {
  bool success = 1;
  string message = 2;
}

message AgentInfoRequest {
  string orchestrator_secret = 1;
}

message AgentInfoResponse {
  string proto_contract_hash = 1;
  string agent_version = 2;
  string proto_contract_source = 3;
}

// Orchestrator supplies the target list (common external anchors) so the same set of hosts is
// probed from every node — that's what makes it possible to spot a shared upstream/segment issue
// by comparing results across nodes centrally, instead of each node picking its own targets.
message NetworkDiagnosticRequest {
  string orchestrator_secret = 1;
  repeated string targets = 2;
}

// Only hops that actually show loss are included (see networkDiagnostic.service.ts on the agent
// side) — keeps the response compact instead of shipping a full per-hop mtr report over the wire.
message NetworkDiagnosticHop {
  uint32 hop_number = 1;
  string address = 2;
  double loss_percent = 3;
  double avg_latency_ms = 4;
}

message NetworkDiagnosticTargetResult {
  string target = 1;
  bool reachable = 2;
  double loss_percent = 3;
  double avg_latency_ms = 4;
  repeated NetworkDiagnosticHop lossy_hops = 5;
  string error = 6;
}

message NetworkDiagnosticResponse {
  bool success = 1;
  string message = 2;
  repeated NetworkDiagnosticTargetResult results = 3;
}

message SingBoxUserTrafficRequest {
  string orchestrator_secret = 1;
}

message SingBoxUserTrafficEntry {
  string user_uuid = 1;
  int64 uplink_bytes = 2;
  int64 downlink_bytes = 3;
}

message SingBoxUserTrafficResponse {
  bool success = 1;
  string message = 2;
  repeated SingBoxUserTrafficEntry entries = 3;
}

message SingBoxConnectionsRequest {
  string orchestrator_secret = 1;
}

// One record per connection as sing-box's Clash API reports it. Both live and recently-closed
// connections are included (the Clash API keeps a closed-connection buffer), so short flows are
// not lost between two polls of a periodic sweep.
message SingBoxConnection {
  // Authenticated inbound user. EMPTY on a Xeon front by design — see the RPC's own comment.
  string user = 1;
  // Real peer address as seen by THIS node. On a front that is the client; on an egress node
  // behind the ring it is the front, not the client.
  string source_ip = 2;
  string destination_ip = 3;
  // Sniffed destination domain when known; empty when the connection was routed by address alone.
  string destination_domain = 4;
  uint32 destination_port = 5;
  // Bytes as counted for THIS connection. Upload is what the peer sent us (the subscriber's
  // upload); download is what we sent back. Keeping them apart is load-bearing: a flood source
  // uploads, a large legitimate download does not.
  int64 upload_bytes = 6;
  int64 download_bytes = 7;
  string network = 8;
  string inbound_tag = 9;
  int64 started_at_unix_ms = 10;
  // True for a record taken from the closed-connection buffer rather than the live set.
  bool closed = 11;
}

message SingBoxConnectionsResponse {
  bool success = 1;
  string message = 2;
  repeated SingBoxConnection connections = 3;
}

message TrafficThrottleEntry {
  // Source prefix in CIDR form.
  string prefix = 1;
  // tc rate spec, e.g. "8mbit".
  string rate = 2;
  // tc burst spec, e.g. "500k". Load-bearing, not a detail: measured on a live kernel, the same
  // rate of 8mbit delivered between 4 and 11 Mbit/s of real TCP goodput depending on this value.
  // Calibrate it on a real node — a veth pair has near-zero RTT and does not represent a real path.
  string burst = 3;
}

message TrafficThrottleRequest {
  string orchestrator_secret = 1;
  // Per-prefix, not one ceiling for the whole list: the escalation ladder has two tiers (a soft
  // ceiling that gathers evidence, a hard one for a source that kept hammering through it), and a
  // tc policer is configured per filter anyway — so carrying one rate for everything would have
  // made the executor unable to express what the ladder decides.
  // An empty list clears the limit entirely.
  repeated TrafficThrottleEntry entries = 2;
}

message TrafficThrottleCounter {
  string prefix = 1;
  int64 sent_bytes = 2;
  int64 sent_packets = 3;
  int64 dropped_packets = 4;
}

message TrafficThrottleResponse {
  bool success = 1;
  string message = 2;
  // False when the requested state already matched and the filters were left alone.
  bool changed = 3;
  int32 applied = 4;
  // Read BEFORE any change, so they describe the period since the previous rebuild.
  repeated TrafficThrottleCounter counters = 5;
}

message RearSingboxConfigPayload {
  string orchestrator_secret = 1;
  // false — stop the instance and remove its unit. Deliberately part of this same RPC rather than
  // a separate Delete: the orchestrator always knows the state it wants, and one idempotent call
  // cannot leave the node in a state neither side asked for.
  bool enabled = 2;
  // Generated centrally (rearSingbox.ts), never assembled on the node: it carries WARP private
  // keys from the orchestrator's pool, and which key belongs to which node is the orchestrator's
  // bookkeeping alone.
  string config_json = 3;
}

message RearSingboxConfigResponse {
  bool success = 1;
  string message = 2;
  // State AFTER the call, read back from the unit rather than assumed from success.
  bool running = 3;
  // Set when the agent deliberately did nothing: "singbox_not_installed" (no binary to run a
  // second instance from), "check_failed" (sing-box rejected config_json — the previous config is
  // left running untouched). Empty when the requested state was applied.
  string skipped_reason = 4;
}

message WarpKeyHealthRequest {
  string orchestrator_secret = 1;
}

message WarpKeyHealthEntry {
  // The rear config's endpoint tag, which carries the orchestrator's own key id in full. It is the
  // only thread tying a measurement back to a row in warp_keys, which is why it is not shortened.
  string endpoint_tag = 1;
  // False when the last probe failed (Clash API returned an empty history for this endpoint).
  bool alive = 2;
  // Round-trip milliseconds from the stored measurement. Meaningless when alive is false.
  uint32 rtt_ms = 3;
  // When that measurement was taken, NOT when this RPC ran — a stale timestamp is itself a signal
  // that the rear instance stopped probing.
  int64 measured_at_unix_ms = 4;
}

message WarpKeyHealthResponse {
  bool success = 1;
  string message = 2;
  repeated WarpKeyHealthEntry entries = 3;
  // Set when the agent deliberately reported nothing: "rear_not_running" (no rear instance on this
  // node) or "clash_api_unreachable" (the instance is up but its API did not answer). Empty on a
  // normal report, INCLUDING one with no entries at all — that case means the rear runs with no
  // WARP endpoints, which is a real and expected state while the pool is still filling.
  string skipped_reason = 4;
}
