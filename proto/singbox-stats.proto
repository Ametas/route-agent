// Vendored verbatim from SagerNet/sing-box (MIT-licensed), branch `testing`, path
// experimental/v2rayapi/stats.proto — confirmed against the real upstream source, 2026-08-19
// (https://raw.githubusercontent.com/SagerNet/sing-box/testing/experimental/v2rayapi/stats.proto).
// NOT our own contract — do not add project-specific fields here or "fix" naming to match our
// conventions; keep it byte-identical to upstream so a future re-sync is a trivial diff. Used by
// src/utils/singboxStats.ts to query sing-box's own local (loopback-only) V2Ray-API-compatible
// stats service for per-user traffic deltas (`experimental.v2ray_api` in the sing-box config we
// generate — see route-orchestrator's egressSingbox.ts). This is a SEPARATE proto/gRPC target
// from proto/agent.proto (our own orchestrator<->agent contract) — route-agent acts as a gRPC
// CLIENT to sing-box using this schema, purely locally, never exposed to the orchestrator or the
// public internet.
syntax = "proto3";

package experimental.v2rayapi;
option go_package = "github.com/sagernet/sing-box/experimental/v2rayapi";

message GetStatsRequest {
  // Name of the stat counter.
  string name = 1;
  // Whether or not to reset the counter to fetching its value.
  bool reset = 2;
}

message Stat {
  string name = 1;
  int64 value = 2;
}

message GetStatsResponse {
  Stat stat = 1;
}

message QueryStatsRequest {
  // Deprecated, use Patterns instead
  string pattern = 1;
  bool reset = 2;
  repeated string patterns = 3;
  bool regexp = 4;
}

message QueryStatsResponse {
  repeated Stat stat = 1;
}

message SysStatsRequest {}

message SysStatsResponse {
  uint32 NumGoroutine = 1;
  uint32 NumGC = 2;
  uint64 Alloc = 3;
  uint64 TotalAlloc = 4;
  uint64 Sys = 5;
  uint64 Mallocs = 6;
  uint64 Frees = 7;
  uint64 LiveObjects = 8;
  uint64 PauseTotalNs = 9;
  uint32 Uptime = 10;
}

service StatsService {
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse) {}
  rpc QueryStats(QueryStatsRequest) returns (QueryStatsResponse) {}
  rpc GetSysStats(SysStatsRequest) returns (SysStatsResponse) {}
}
